<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mini-Z Virtual Drift Circuit</title>
    <meta name="description" content="RC カーを載せて遊ぶ、iPad 用のバーチャル・ドリフトサーキット" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini-Z Circuit" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="サーキット"></canvas>

    <div id="loading">読み込み中…</div>

    <!-- 端に寄せた操作ボタン -->
    <div id="hud">
      <button id="btnMenu" aria-label="設定">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <button id="btnPlay" aria-label="再生・停止"></button>
      <button id="btnHide" aria-label="UI を非表示">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.3-4 10.5-7C21.3 9 17.5 5 12 5zm0 11a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"/><path stroke="currentColor" stroke-width="2" d="M3 3l18 18"/></svg>
      </button>
    </div>

    <!-- UI 非表示中に端をタップして再表示 -->
    <div id="edgeL" class="edge" hidden></div>
    <div id="edgeR" class="edge" hidden></div>

    <aside id="panel" hidden aria-label="設定"></aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
